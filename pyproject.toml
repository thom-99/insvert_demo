[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inSVert"
version = "0.1.0"
description = "Structural Variant Simulation & Insertion Toolkit"
authors = [{name = "Thomas Di Marzo"}]
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "pysam>=0.22.0",
    "pyyaml",
    "rich-click",
    "rich"
]
requires-python = ">=3.7"

[project.scripts]
inSVert = "inSVert.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["inSVert*"]
