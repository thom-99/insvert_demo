genome:
  ploidy: 1
  heterozygosity: 0 # Fraction of emitted variants present on some, but not all, haplotypes.

variants:

  # Single-Nucleotide Polymorphisms
  SNP:
    ratio: 0.0001          # SNP density: 1 per 10,000 bp
    tstv_ratio: 2.0        # Transition/Transversion ratio (~2.0 for human genomes)

  # Multi-Nucleotide Polymorphisms
  MNP:
    ratio: 0.00005
    tstv_ratio: 2.0        

  # Deletions
  DEL:
    count: 30       #n. of variants to simulate 
    distribution: "pareto"   # type of distr. for variant lengths (pareto/normal)
    parameters:
      median_length: 3000       # Target median length in bp
      min_length: 100           # minimum length of the variant
      max_length: 10000         # maximum length of the variant

  # Insertions 
  INS:
    count: 30
    distribution: "normal"
    parameters:
      median_length: 1000
      sigma: 250
      min_length: 100
      max_length: 3000

  # Tandem Duplications
  DUP:                                
    count: 20
    distribution: "normal"
    parameters:
      median_length: 2000
      sigma: 500
      min_length: 250
      max_length: 8000
    copy_number:           
      min: 2
      max: 5
      weights: [0.7, 0.2, 0.05, 0.05] # Probability for CN=2, 3, 4, 5

  # Inversions
  INV:
    count: 20
    distribution: "normal"
    parameters:
      median_length: 5000
      sigma: 1000
      min_length: 500
      max_length: 15000

  # Copy & Paste traslocations / Interspersed Duplications
  TRA_COPY:
    count: 5
    distribution: "normal"   
    reverse_ratio: 0.5   # Probability of being spawned in reverse orientation 
    parameters:
      median_length: 2000
      sigma: 500
      min_length: 250
      max_length: 6000

  # Cut & Paste traslocations
  TRA_CUT:
    count: 5
    distribution: "normal"   
    reverse_ratio: 0.5   # Probability of being spawned in reverse orientation 
    parameters:
      median_length: 2000
      sigma: 500
      min_length: 250
      max_length: 6000
